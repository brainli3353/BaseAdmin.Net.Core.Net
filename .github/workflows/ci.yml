name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端构建 + 零库档测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 严格门构建（0W/0E）
        run: dotnet build src/Web.Entry/AdminCore.Web.Entry.csproj -warnaserror

      - name: 零库档快测（无需 PG/Redis）
        run: >
          dotnet test src/Test/AdminCore.Test.csproj --nologo
          --filter "FullyQualifiedName~BatchSGErrCodeCoverageEnumColumn|FullyQualifiedName~BatchAQErrorCode|FullyQualifiedName~BatchZEnum|FullyQualifiedName~BatchOValidation|FullyQualifiedName~BatchAEAdo|FullyQualifiedName~BatchALLocalization|FullyQualifiedName~BatchT48CacheInvalidationGuard|FullyQualifiedName~BatchBackflowFileLogger|FullyQualifiedName~BatchBackflowPagingGuard"

  frontend:
    name: 前端类型检查 + 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 启用 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建
        run: pnpm build
